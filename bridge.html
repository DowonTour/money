<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지도 안전 연결</title>
    <style>
        body { background-color: #121212; color: #e5b035; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif; }
        .loader { border: 4px solid #333; border-top: 4px solid #2196F3; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>안전하게 지도로 이동 중입니다...🚀</h2>
    <p style="color:#888; font-size:0.9em;">(잠시만 기다려주세요)</p>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const targetUrl = params.get('url');
            if(targetUrl) {
                // 0.5초 대기 후 네이버 지도 URL로 다이렉트 이동 (앱 선택창 우회)
                setTimeout(() => {
                    location.replace(targetUrl);
                }, 500); 
            } else {
                document.body.innerHTML = "<h2 style='color:#ff5252;'>잘못된 접근입니다.</h2>";
            }
        };
    </script>
</body>
</html>
